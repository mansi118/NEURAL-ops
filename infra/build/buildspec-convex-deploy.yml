# CodeBuild buildspec — deploy the Mempalace Convex functions to the INTERNAL self-hosted backend.
# Runs VPC-attached (private subnets) so it can reach convex.<ns>:3210, which has no public IP.
# Source zip = the Mempalace_NEOS repo root (package.json + convex/).
#   CONVEX_SELF_HOSTED_URL        http://convex.<ns>:3210   (passed as a plain env var)
#   CONVEX_SELF_HOSTED_ADMIN_KEY  from Secrets Manager (secrets-manager env, never plaintext)
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo "Target Convex: $CONVEX_SELF_HOSTED_URL"
      - npm ci || npm install
  build:
    commands:
      # --yes = non-interactive; self-hosted creds come from the env (URL + admin key).
      - npx convex deploy -y
  post_build:
    commands:
      - echo "Convex functions deployed to $CONVEX_SELF_HOSTED_URL"
