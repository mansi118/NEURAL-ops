# CodeBuild buildspec — deploy the Mempalace Convex functions to the INTERNAL self-hosted backend.
# Runs VPC-attached in the spine's NO-NAT private subnets, so it has NO internet egress. Therefore:
#   - node_modules is BUNDLED in the source zip (convex-deploy.sh) — do NOT npm install (would ETIMEDOUT).
#   - invoke the LOCAL convex binary directly (node_modules/.bin/convex), never `npx` (which may hit the net).
# Source zip = Mempalace_NEOS repo root + node_modules (symlinks preserved).
#   CONVEX_SELF_HOSTED_URL        the internal convex API url (plain env var)
#   CONVEX_SELF_HOSTED_ADMIN_KEY  from Secrets Manager (secrets-manager env, never plaintext)
# NOTE: no echo/log lines with quoted colons — they break when this is passed via --buildspec-override.
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
  build:
    commands:
      # deps are bundled; deploy with the local convex CLI (no network) to the self-hosted backend.
      - node_modules/.bin/convex deploy -y
