# /etc/systemd/resolved.conf.d/neos-cloudmap.conf  (on the matrix box)
#
# WHY: the spine Cloud Map zone is neos-dogfood.LOCAL. systemd-resolved special-cases the `.local`
# suffix as multicast DNS (mDNS) and will NOT forward those queries to the VPC unicast resolver — so
# `getent hosts seat-wrapper.neos-dogfood.local` FAILS even though the Route53 zone (now associated with
# the matrix VPC) answers correctly when the VPC resolver 172.31.0.2 is queried directly. This drop-in
# routes ONLY that zone to the VPC resolver via unicast. It is additive and does not affect any other
# name (Synapse federation, neuraledge.in, etc. keep their normal path). Reverse by deleting this file
# and `sudo systemctl restart systemd-resolved`.
#
# Install:
#   sudo mkdir -p /etc/systemd/resolved.conf.d
#   sudo cp resolved-neos-cloudmap.conf /etc/systemd/resolved.conf.d/neos-cloudmap.conf
#   sudo systemctl restart systemd-resolved
#   getent hosts seat-wrapper.neos-dogfood.local   # -> 10.40.x.x (the current wrapper task)

[Resolve]
DNS=172.31.0.2
Domains=~neos-dogfood.local
