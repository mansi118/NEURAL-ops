# nginx vhost for nc-web (NeuralChat) at chat.neuraledge.in — mirrors the element.neuraledge.in pattern
# on the matrix box. Serves the static SPA build; all client↔homeserver traffic goes to
# matrix.neuraledge.in directly (nc-web is a pure Matrix client, no backend to proxy).
#
# TLS: obtain the cert first (see docs/deployment/nc-web-deploy-runbook.md), then certbot rewrites the
# 80→443 redirect and the ssl_* lines into this file, same as the other vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name chat.neuraledge.in;

    root /var/www/nc-web;
    index index.html;

    # long-cache the fingerprinted assets (index-*.js / matrix-sdk-*.js etc.)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every route serves index.html (no server-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the entrypoint, so a deploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
